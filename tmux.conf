# -------------------------
# Core performance
# -------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -g history-limit 10000
set -sg escape-time 10

# -------------------------
# Prefix (keep your preference)
# -------------------------
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# -------------------------
# Basic usability
# -------------------------
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind C-i select-layout even-vertical
bind C-v select-layout even-horizontal
bind C-o resize-pane -y 1000

# sync panes (keep but lightweight)
bind C-s set-window-option synchronize-panes

# -------------------------
# Mouse (keep, but simplified)
# -------------------------
set -g mouse on

# -------------------------
# Copy mode (clean vi style)
# -------------------------
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# -------------------------
# Visual cleanup (IMPORTANT)
# -------------------------
set -g status off
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour33

setw -g monitor-activity off
set -g visual-activity off
